name: Daily Strategy Digest

on:
  schedule:
    - cron: "0 9 * * *"   # 09:00 UTC every day
  workflow_dispatch:       # allow manual trigger

jobs:
  send-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Send daily performance digest
        env:
          UPBIT_CRON_SECRET: ${{ secrets.UPBIT_CRON_SECRET }}
        run: |
          curl --fail --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${UPBIT_CRON_SECRET}" \
            "https://soloris-signals.vercel.app/api/daily-digest"
